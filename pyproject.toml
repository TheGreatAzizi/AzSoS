[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azsos"
version = "0.3.4"
description = "Offline-first emergency knowledge cache and .azsos package toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "The Azizi" }]
keywords = ["offline", "emergency", "cache", "windows", "ed25519", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]
dependencies = [
  "PyNaCl>=1.5.0",
  "Markdown>=3.5.0",
  "qrcode[pil]>=7.4.0",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "build>=1.0.0", "pyinstaller>=6.0.0"]

[project.scripts]
azsos = "azsos:main"

[project.urls]
Homepage = "https://github.com/TheGreatAzizi/AzSoS"
X = "https://x.com/the_azzi"
GitHub = "https://github.com/TheGreatAzizi"
SelfHostedGit = "https://git.theazizi.ir/TheAzizi"
Telegram = "https://t.me/luluch_code"

[tool.setuptools]
py-modules = ["azsos", "run_app"]

[tool.setuptools.packages.find]
include = ["azsos_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
